# electron-builder 設定（Phase 11：Windows 安裝程式；PROJECT_SPEC §13）。
# 打包步驟見 README「Phase 11：打包 Windows 安裝程式」：先打包後端與準備 FFmpeg，再執行 npm run dist:win。
appId: com.mvr2t.desktop  # 與 main.ts 的 setAppUserModelId 一致（Windows 通知）
productName: MVR2T  # 也決定 userData 資料夾名稱（%APPDATA%\MVR2T），不可更改，否則找不到已下載的模型
copyright: MVR2T
# 套件名稱 @mvr2t/desktop 會變成安裝資料夾名稱（%LOCALAPPDATA%\Programs\@mvr2tdesktop）與更新快取名稱。
# 只改打包後的 package.json 名稱（開發環境的 workspace 名稱不變）→ %LOCALAPPDATA%\Programs\MVR2T。
extraMetadata:
  name: MVR2T
# 移除自訂 electronDist 帶進來的 default_app.asar
afterPack: ./scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
# 使用本機已安裝的 Electron（node_modules/electron/dist），打包時不必再從 GitHub 下載
electronDist: ../../node_modules/electron/dist
# renderer 由 Vite、main／preload 由 esbuild 打包成單一檔案，執行時不需要 node_modules
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!**/*.map"
  - "!node_modules/**"
npmRebuild: false
asar: true
extraResources:
  # PyInstaller onedir（apps/backend/dist/mvr2t-backend）→ resources/backend/mvr2t-backend(.exe)（electron/backend.ts）
  - from: ../backend/dist/mvr2t-backend
    to: backend
  - from: build-resources/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  # LGPL 版 FFmpeg（apps/backend 的 scripts.ffmpeg_bundle 下載並驗證）→ resources/ffmpeg/（只有 Windows 內附）
  extraResources:
    - from: build-resources/ffmpeg
      to: ffmpeg
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # 第一版不簽章（使用者決定，2026-11-14）：第一次執行時 SmartScreen 會提示「仍要執行」
  signAndEditExecutable: true
nsis:
  # 只為目前使用者安裝（使用者決定）：%LOCALAPPDATA%\Programs\MVR2T，不需要系統管理員權限
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MVR2T
  installerLanguages: [zh_TW]
  language: "1028"
  # 解除安裝時保留 %APPDATA%\MVR2T（已下載約 6 GB 的模型、偏好設定）；要完全移除請手動刪除該資料夾
  deleteAppDataOnUninstall: false
  # 解除安裝登錄項目補上 InstallLocation；刪除 electron-builder 為自動更新保留的安裝檔副本（約 350 MB）
  include: build/installer.nsh
  artifactName: MVR2T-Setup-${version}-x64.${ext}
mac:
  # Phase 12（使用者決定 2026-11-17）：沒有 Mac 可測試、不購買簽章 → 只準備設定，未實機驗證。
  # 必須在 Mac 上組建（後端 PyInstaller 要在 macOS 打包）：見 README「macOS（未驗證）」。
  # - 只做 Apple Silicon（arm64）：llama.cpp 只固定了 macos-arm64；Intel Mac 規格 §6.3 第一版用 CPU，尚未提供。
  # - 不簽章、不公證（identity: null）：第一次開啟要在「系統設定 → 隱私權與安全性」按「強制打開」，或右鍵 → 打開。
  # - 不內附 FFmpeg（找不到可直接散布的 LGPL macOS 版）：請使用者以 Homebrew 安裝（brew install ffmpeg），後端會到 /opt/homebrew/bin 尋找。
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  icon: build/icon.png
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: MVR2T-${version}-arm64.${ext}
dmg:
  title: MVR2T ${version}
linux:
  # 只用於沙盒驗證打包設定（目標平台是 Windows；macOS 見上方）
  target: [dir]
  executableName: mvr2t
  category: AudioVideo
